name: Minimize

options:
  bundleIdPrefix: com.norberttak
  deploymentTarget:
    macOS: "26.5"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 1.9.4

targets:
  Minimize:
    type: application
    platform: macOS
    sources:
      - path: Minimize/Sources
    resources:
      - path: Minimize/Resources/Assets.xcassets
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norberttak.Minimize
        PRODUCT_NAME: Minimize
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.5"
        CODE_SIGN_ENTITLEMENTS: Minimize/Resources/Minimize.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Minimize
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ENABLE_EXPLICIT_MODULES: "NO"

  MinimizeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MinimizeTests
    dependencies:
      - target: Minimize
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.5"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Minimize:
    build:
      targets:
        Minimize: all
        MinimizeTests: [test]
    test:
      targets:
        - MinimizeTests
    run:
      config: Debug
